<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey Planner</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1c1b19; --muted: #6b6a65; --line: #e6e3dc;
    --train: #d62728; --metro: #1f77b4; --bus: #b7791f; --walk: #8a8780; --change: #7a5cc4;
    --good: #1a7f4b; --focus: #1f77b4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1e1d1b; --ink: #f1efe9; --muted: #9a978e; --line: #33312d;
      --train: #ff6b6b; --metro: #5aa9e6; --bus: #e0a64a; --walk: #8a8780; --change: #a68bf0;
      --good: #4fc58b; --focus: #5aa9e6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .planner {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; display: grid; gap: 12px;
  }
  .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } .swap { justify-self: center; } }
  .field { position: relative; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em;
          text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
  }
  input:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .swap {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 10px; width: 42px; height: 42px; font-size: 18px; cursor: pointer;
  }
  .go {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px;
    background: var(--ink); color: var(--bg); cursor: pointer;
  }
  .go:disabled { opacity: .35; cursor: not-allowed; }

  .suggest {
    position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px;
    list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 280px; overflow: auto;
  }
  .suggest li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px;
                border-radius: 8px; cursor: pointer; }
  .suggest li:hover, .suggest li.active { background: var(--bg); }
  .mtag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .mtag-train { color: var(--train); } .mtag-metro { color: var(--metro); } .mtag-bus { color: var(--bus); }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px;
              font-size: 13px; color: var(--muted); }
  .ex { font: inherit; font-size: 13px; color: var(--ink); background: transparent; cursor: pointer;
        border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .ex:hover { background: var(--card); }

  #status { margin: 20px 2px 0; color: var(--muted); }
  #status.err { color: var(--train); }
  #results { margin-top: 12px; display: grid; gap: 12px; }

  details.opt { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  details.opt[open] { border-color: var(--ink); }
  summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid;
            grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  .rank { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg);
          display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
          color: #fff; white-space: nowrap; }
  .chip-train { background: var(--train); } .chip-metro { background: var(--metro); } .chip-bus { background: var(--bus); }
  .arrow { color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge { font-size: 11px; font-weight: 700; color: var(--good); border: 1px solid var(--good);
           border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  .cost { text-align: right; font-variant-numeric: tabular-nums; }
  .cost b { font-size: 20px; display: block; line-height: 1; }
  .cost span { font-size: 11px; color: var(--muted); }

  ol.legs { list-style: none; margin: 0; padding: 4px 16px 16px 58px; }
  .leg { position: relative; padding: 0 0 14px 16px; border-left: 3px solid var(--walk); }
  .leg:last-child { padding-bottom: 0; }
  .leg-train { border-color: var(--train); } .leg-metro { border-color: var(--metro); }
  .leg-bus { border-color: var(--bus); } .leg-interchange { border-color: var(--change); }
  .leg-walk { border-left-style: dashed; }
  .leg-title { font-weight: 600; }
  .leg-sub { color: var(--muted); font-size: 14px; }

  footer { margin-top: 32px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Plan your journey</h1>
  <p class="sub">Covers Andheri to Ghatkopar. Train, metro and bus combined in one result.</p>

  <form class="planner" id="form" autocomplete="off">
    <div class="row">
      <div class="field">
        <label for="from">From</label>
        <input id="from" placeholder="Station or bus stop" role="combobox" aria-expanded="false">
        <ul class="suggest" id="from-list" hidden></ul>
      </div>
      <button type="button" class="swap" id="swap" title="Swap" aria-label="Swap from and to">⇄</button>
      <div class="field">
        <label for="to">To</label>
        <input id="to" placeholder="Station or bus stop" role="combobox" aria-expanded="false">
        <ul class="suggest" id="to-list" hidden></ul>
      </div>
    </div>
    <button class="go" id="go" disabled>Find routes</button>
    <div class="examples">
      Try:
      <button type="button" class="ex" data-a="Vile Parle|train" data-b="Ghatkopar|metro">Vile Parle → Ghatkopar</button>
      <button type="button" class="ex" data-a="Versova|metro" data-b="Chembur|train">Versova → Chembur</button>
      <button type="button" class="ex" data-a="Jogeshwari|train" data-b="Govandi|train">Jogeshwari → Govandi</button>
    </div>
  </form>

  <div id="status" role="status"></div>
  <div id="results"></div>

  <footer>Prototype. Costs are relative units, not minutes. Stop data is the public Mumbai GTFS (BEST) plus suburban rail and Metro Line 1 stations.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const MODE = { train: 'Train', metro: 'Metro', bus: 'Bus' };
const sel = { from: null, to: null };

function update() { $('#go').disabled = !(sel.from && sel.to); }

function attach(input, list, key) {
  let items = [], active = -1, timer;
  const close = () => { list.hidden = true; active = -1; input.setAttribute('aria-expanded', 'false'); };
  const render = () => {
    list.replaceChildren();
    items.forEach((it, i) => {
      const li = el('li', i === active ? 'active' : '');
      li.append(el('span', null, it.name), el('span', 'mtag mtag-' + it.mode, it.mode));
      li.addEventListener('mousedown', e => { e.preventDefault(); pick(it); });
      list.append(li);
    });
    list.hidden = items.length === 0;
    input.setAttribute('aria-expanded', String(!list.hidden));
  };
  const pick = it => { sel[key] = it; input.value = it.label; close(); update(); };

  input.addEventListener('input', () => {
    sel[key] = null; update();
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) { items = []; render(); return; }
    timer = setTimeout(async () => {
      try {
        const r = await fetch('/api/stops?q=' + encodeURIComponent(q));
        items = await r.json(); active = -1; render();
      } catch (_) { items = []; render(); }
    }, 120);
  });
  input.addEventListener('keydown', e => {
    if (list.hidden) return;
    if (e.key === 'ArrowDown') { active = (active + 1) % items.length; render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { active = (active - 1 + items.length) % items.length; render(); e.preventDefault(); }
    else if (e.key === 'Enter' && active >= 0) { pick(items[active]); e.preventDefault(); }
    else if (e.key === 'Escape') close();
  });
  input.addEventListener('blur', close);
  return it => { sel[key] = it; input.value = it.label; update(); };
}

const setFrom = attach($('#from'), $('#from-list'), 'from');
const setTo = attach($('#to'), $('#to-list'), 'to');

$('#swap').addEventListener('click', () => {
  const a = sel.from, b = sel.to;
  $('#from').value = b ? b.label : ''; $('#to').value = a ? a.label : '';
  sel.from = b; sel.to = a; update();
});

// ---------- results ----------
function legTitle(l) {
  if (l.mode === 'walk') return 'Walk ' + l.label;
  if (l.mode === 'interchange') return 'Change inside the station';
  return MODE[l.mode] + ' ' + l.label;
}

function renderOption(o) {
  const d = el('details', 'opt');
  if (o.rank === 1) d.open = true;

  const s = el('summary');
  s.append(el('span', 'rank', String(o.rank)));

  const mid = el('div');
  const chips = el('div', 'chips');
  o.rides.forEach((r, i) => {
    if (i) chips.append(el('span', 'arrow', '→'));
    chips.append(el('span', 'chip chip-' + r.mode, MODE[r.mode] + ' ' + r.label));
  });
  o.tags.forEach(t => chips.append(el('span', 'badge', t)));
  const changes = o.changes === 0 ? 'Direct' : o.changes + (o.changes === 1 ? ' change' : ' changes');
  mid.append(chips, el('div', 'meta', changes + ' · ' + o.walk_m + ' m walking'));
  s.append(mid);

  const cost = el('div', 'cost');
  cost.title = 'Relative cost units, lower is better';
  cost.append(el('b', null, String(o.cost)), el('span', null, 'cost'));
  s.append(cost);
  d.append(s);

  const ol = el('ol', 'legs');
  o.legs.forEach(l => {
    const li = el('li', 'leg leg-' + l.mode);
    li.append(el('div', 'leg-title', legTitle(l)), el('div', 'leg-sub', l.from + ' → ' + l.to));
    ol.append(li);
  });
  d.append(ol);
  return d;
}

let planId = 0;
async function plan() {
  const my = ++planId;                       // only the latest request may draw
  const status = $('#status'), box = $('#results');
  status.className = ''; status.textContent = 'Finding routes…'; box.replaceChildren();
  $('#go').disabled = true;
  try {
    const r = await fetch('/api/plan?src=' + encodeURIComponent(sel.from.ids) +
                          '&dst=' + encodeURIComponent(sel.to.ids) + '&k=3');
    const data = await r.json();
    if (my !== planId) return;               // a newer search replaced this one
    box.replaceChildren();
    if (!r.ok) throw new Error(data.detail || 'Something went wrong.');
    if (!data.options.length) { status.textContent = 'No route found between these two places.'; return; }
    status.textContent = data.options.length + (data.options.length === 1 ? ' route' : ' routes') +
                         ' found, best first';
    data.options.forEach(o => box.append(renderOption(o)));
  } catch (e) {
    if (my === planId) { status.className = 'err'; status.textContent = e.message; }
  } finally {
    if (my === planId) update();             // re-enable the button
  }
}

$('#form').addEventListener('submit', e => { e.preventDefault(); if (sel.from && sel.to) plan(); });

// example chips: resolve "Name|mode" to a stop group, fill both boxes, run
async function resolve(spec) {
  const [name, mode] = spec.split('|');
  const r = await fetch('/api/stops?q=' + encodeURIComponent(name) + '&mode=' + mode);
  const items = await r.json();
  return items.find(i => i.name.toLowerCase() === name.toLowerCase()) || items[0];
}
document.querySelectorAll('.ex').forEach(b => b.addEventListener('click', async () => {
  const [a, c] = await Promise.all([resolve(b.dataset.a), resolve(b.dataset.b)]);
  if (!a || !c) { $('#status').className = 'err'; $('#status').textContent = 'Example stops not found in your data.'; return; }
  setFrom(a); setTo(c); plan();
}));
</script>
</body>
</html>
